openapi: 3.0.3
info:
  title: FoTell Prediction Markets API
  description: |
    **FoTell** is a binary prediction market platform where users can trade shares on yes/no outcomes.
    
    ## Features
    - Binary prediction markets (YES/NO outcomes)
    - LSMR automated market maker (AMM)
    - Secure authentication with JWT
    - Real-time price discovery
    - KES currency (Kenyan Shillings)
    
    ## Authentication
    Most endpoints require JWT authentication. Include the token in the `Authorization` header:
    ```
    Authorization: Bearer <your_token>
    ```
    
    ## Currency
    - All balances and costs are in **cents** (smallest unit)
    - 100 cents = 1 KES
    - Example: `balance: 500000` = 5000.00 KES
    
    ## Trading Flow
    1. Register/Login → Get JWT token
    2. Check balance → Ensure sufficient funds
    3. Browse markets → Find interesting predictions
    4. View prices → See current YES/NO probabilities
    5. Place trade → Buy shares on outcome
    6. Track position → Monitor holdings
    7. Settlement → Collect payout when market resolves
    
    ## Market Lifecycle
    ```
    PENDING → OPEN → CLOSED → RESOLVED
    ```
    
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.fotell.com/v1
    description: Production server

tags:
  - name: Authentication
    description: User registration, login, and token management
  - name: User
    description: User profile, balance, and portfolio
  - name: Markets
    description: Browse and view prediction markets
  - name: Trading
    description: Place trades and manage positions
  - name: Admin
    description: Market creation and lifecycle management (admin only)

paths:
  # ============================================================================
  # AUTHENTICATION
  # ============================================================================
  
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: |
        Create a new user account. All users start with an initial balance of 5000 KES.
        
        **Validation:**
        - Email must be valid and unique
        - Username must be 3-30 characters
        - Password must be at least 8 characters
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - username
              properties:
                email:
                  type: string
                  format: email
                  example: trader@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: securePassword123
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  example: cryptotrader
                full_name:
                  type: string
                  example: John Doe
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emailExists:
                  value:
                    error: Email already registered
                    details:
                      error_code: EMAIL_EXISTS
                      field: email

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user and receive JWT tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: trader@example.com
                password:
                  type: string
                  format: password
                  example: securePassword123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Exchange refresh token for new access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  example: bacc17995ce580d73616478a2661fe3772ca3eefbaab8765e5e9917c56766fb1
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired refresh token

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Invalidate refresh token
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully

  # ============================================================================
  # USER ENDPOINTS
  # ============================================================================
  
  /users/me:
    get:
      tags:
        - User
      summary: Get current user profile
      description: Retrieve authenticated user's profile information
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/me/balance:
    get:
      tags:
        - User
      summary: Get user balance
      description: |
        Retrieve current account balance in smallest units (cents).
        
        **Conversion:**
        - Balance is stored in cents (1 KES = 100 cents)
        - Example: `500000` cents = 5000.00 KES
      operationId: getBalance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Balance retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance_smallest_unit:
                    type: integer
                    format: int64
                    description: Balance in cents
                    example: 500000
                  balance_kes:
                    type: number
                    format: double
                    description: Balance in KES (for display)
                    example: 5000.00

  /users/me/positions:
    get:
      tags:
        - User
      summary: Get user positions
      description: List all positions (holdings) across all markets
      operationId: getPositions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Positions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  positions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Position'

  /users/me/trades:
    get:
      tags:
        - User
      summary: Get user trade history
      description: List all trades made by the user
      operationId: getMyTrades
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Maximum number of results
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Pagination offset
      responses:
        '200':
          description: Trades retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trade'
                  total:
                    type: integer
                    example: 42

  # ============================================================================
  # MARKETS (PUBLIC)
  # ============================================================================
  
  /markets:
    get:
      tags:
        - Markets
      summary: List markets
      description: |
        Retrieve list of prediction markets with optional filtering.
        
        **Filtering:**
        - Filter by status (PENDING, OPEN, CLOSED, RESOLVED)
        - Paginate results with limit/offset
      operationId: listMarkets
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, OPEN, CLOSED, RESOLVED]
          description: Filter by market status
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Maximum number of results
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Pagination offset
      responses:
        '200':
          description: Markets retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  markets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Market'
                  total:
                    type: integer
                    example: 42
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0

  /markets/{marketID}:
    get:
      tags:
        - Markets
      summary: Get market details
      description: Retrieve detailed information about a specific market
      operationId: getMarket
      parameters:
        - $ref: '#/components/parameters/marketID'
      responses:
        '200':
          description: Market retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Market'
        '404':
          description: Market not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /markets/{marketID}/prices:
    get:
      tags:
        - Markets
      summary: Get current prices
      description: |
        Retrieve current YES and NO prices for a market.
        
        **Prices:**
        - Range: 0-100 (representing probability as percentage)
        - Sum: YES + NO = 100 (always)
        - Example: YES=62.5, NO=37.5 means 62.5% probability of YES
        
        **Only available for OPEN markets**
      operationId: getPrices
      parameters:
        - $ref: '#/components/parameters/marketID'
      responses:
        '200':
          description: Prices retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  market_id:
                    type: string
                    format: uuid
                    example: f6ca8e7b-38bc-4c4d-ab42-0ec1ca8e877d
                  yes_price:
                    type: number
                    format: double
                    minimum: 0
                    maximum: 100
                    example: 62.5
                  no_price:
                    type: number
                    format: double
                    minimum: 0
                    maximum: 100
                    example: 37.5
                  timestamp:
                    type: string
                    format: date-time
                    example: 2026-03-08T15:30:00Z
        '400':
          description: Market not open for trading
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Market not open for trading
                details:
                  error_code: MARKET_NOT_OPEN
                  current_status: PENDING

  /markets/{marketID}/trades:
    get:
      tags:
        - Markets
      summary: Get market trade history
      description: List all trades for a specific market (public data)
      operationId: listMarketTrades
      parameters:
        - $ref: '#/components/parameters/marketID'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Trades retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  trades:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trade'
                  total:
                    type: integer
  
  /markets/{marketID}/prices/stream:
    get:
      tags:
        - Markets
      summary: Stream real-time prices (SSE)
      description: |
        Server-Sent Events (SSE) endpoint that streams real-time YES/NO price updates for a market.
        
        **Connection Details:**
        - Holds a persistent HTTP connection.
        - Receives periodic `: keepalive` pings to prevent socket drops.
        
        **Data Format:**
        Pushes JSON payloads prefixed with `data: ` whenever a trade alters the AMM pricing curve.
      operationId: streamPrices
      parameters:
        - $ref: '#/components/parameters/marketID'
      responses:
        '200':
          description: SSE Stream connected successfully
          content:
            text/event-stream:
              schema:
                type: string
                description: Stream of Server-Sent Events
                example: |
                  : connected

                  data: {"market_id":"50281a59-ece1-404e-ba9c-63f48df2663e","yes_price":49.5,"no_price":50.5,"timestamp":"2026-06-18T14:00:14Z"}
                  
                  : keepalive
        '400':
          description: Invalid market ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Streaming not supported by server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /markets/{marketID}/quote:
    get:
      tags:
        - Trading
      summary: Get trade quote
      description: |
        Calculate how many shares you will receive for a specific budget.
        
        **Budget:** Must be provided in cents.
      operationId: getQuote
      parameters:
        - $ref: '#/components/parameters/marketID'
        - name: outcome
          in: query
          required: true
          schema:
            type: string
            enum: [YES, NO]
        - name: budget
          in: query
          required: true
          schema:
            type: integer
            format: int64
            description: Budget to spend in cents
            example: 500
      responses:
        '200':
          description: Quote retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  shares_expected:
                    type: number
                    format: double
                  price_per_share:
                    type: number
                    format: double
                  budget_spent:
                    type: integer
                    format: int64

  # ============================================================================
  # TRADING
  # ============================================================================
  
  /markets/{marketID}/trades:
    post:
      tags:
        - Trading
      summary: Place a trade
      description: |
        Buy shares on YES or NO outcome. You may provide either `budget` (to spend a fixed amount) 
        OR `shares` (to buy a specific amount). Providing both will result in an error.
        
        **Requirements:**
        - Market must be OPEN
        - User must have sufficient balance
        - Shares must be positive
        
        **Pricing:**
        - Cost is calculated by LSMR automated market maker
        - Price moves based on supply/demand
        - Your balance is the maximum cost (slippage protection)
        
        **Atomicity:**
        - Trade executes atomically (all or nothing)
        - Balance debited, shares added, position updated in single transaction
        
        **Example:**
        - Buy 10 YES shares
        - AMM calculates cost: 501 cents (5.01 KES)
        - Balance debited: 501 cents
        - Position updated: +10 YES shares
        - Prices adjust after trade
      operationId: placeTrade
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/marketID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [YES, NO]
                  description: Which outcome to buy
                  example: YES
                shares:
                  type: number
                  format: double
                  minimum: 1
                  description: Number of shares to buy (optional)
                  example: 10.0
                budget_cents:
                  type: integer
                  format: int64
                  description: Amount to spend in cents (optional)
                  example: 50000
      responses:
        '201':
          description: Trade executed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  trade_id:
                    type: string
                    format: uuid
                    example: abc123-def456-789012
                  outcome:
                    type: string
                    enum: [YES, NO]
                    example: YES
                  shares:
                    type: number
                    format: double
                    example: 10.0
                  cost_paid:
                    type: integer
                    format: int64
                    description: Actual cost in cents
                    example: 501
                  avg_price:
                    type: number
                    format: double
                    description: Average price per share in cents
                    example: 50.1
                  position:
                    $ref: '#/components/schemas/Position'
                  balance_after:
                    type: integer
                    format: int64
                    description: Balance after trade in cents
                    example: 499499
                  timestamp:
                    type: string
                    format: date-time
                    example: 2026-03-08T15:30:00Z
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Insufficient balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: insufficient balance
                details:
                  error_code: INSUFFICIENT_BALANCE
                  hint: trade cost exceeds available balance

  # ============================================================================
  # ADMIN ENDPOINTS
  # ============================================================================
  
  /admin/markets:
    post:
      tags:
        - Admin
      summary: Create market
      description: |
        Create a new prediction market (admin only).
        
        **Initial state:** PENDING
        - Market is created but not accepting trades
        - Admin must explicitly open the market
        
        **Liquidity Parameter:**
        - Controls price volatility
        - Higher value = more liquidity = less price movement
        - Recommendation: 100,000 - 500,000 cents for typical markets
      operationId: createMarket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
                - closes_at
                - liquidity_param
              properties:
                question:
                  type: string
                  minLength: 10
                  maxLength: 500
                  example: Will Bitcoin reach $100k by end of month?
                description:
                  type: string
                  example: Resolves YES if BTC >= $100,000 on any exchange by March 31st
                closes_at:
                  type: string
                  format: date-time
                  description: When trading ends (must be in future)
                  example: 2026-04-01T00:00:00Z
                liquidity_param:
                  type: integer
                  format: int64
                  minimum: 10000
                  description: Liquidity parameter in cents
                  example: 500000
      responses:
        '201':
          description: Market created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Market'
        '400':
          description: Validation error
        '403':
          description: Requires admin role

  /admin/markets/{marketID}/open:
    post:
      tags:
        - Admin
      summary: Open market for trading
      description: |
        Transition market from PENDING to OPEN (admin only).
        
        **Effects:**
        - Market accepts trades
        - AMM initialized with 50/50 prices
        - Users can buy YES/NO shares
        
        **Idempotent:** Can call multiple times safely
      operationId: openMarket
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/marketID'
      responses:
        '200':
          description: Market opened successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Market opened successfully
                  status:
                    type: string
                    example: OPEN
        '400':
          description: Invalid state transition
        '403':
          description: Requires admin role
        '404':
          description: Market not found

  /admin/markets/{marketID}/close:
    post:
      tags:
        - Admin
      summary: Close market
      description: |
        Transition market from OPEN to CLOSED (admin only).
        
        **Effects:**
        - Trading stops
        - Prices frozen
        - Ready for resolution
        
        **Required before resolution**
      operationId: closeMarket
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/marketID'
      responses:
        '200':
          description: Market closed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Market closed successfully
                  status:
                    type: string
                    example: CLOSED
        '400':
          description: Invalid state transition
        '403':
          description: Requires admin role

  /admin/markets/{marketID}/resolve:
    post:
      tags:
        - Admin
      summary: Resolve market
      description: |
        Resolve market with final outcome (admin only).
        
        **Requirements:**
        - Market must be CLOSED
        - Cannot be reversed
        
        **Effects:**
        - Winning shares pay out 100 cents each
        - Losing shares pay out 0 cents
        - Positions settled
        - Balances credited
        
        **Example:**
        - Market resolves to YES
        - User has 10 YES shares + 5 NO shares
        - Cost basis: 750 cents
        - Payout: 10 × 100 = 1000 cents
        - PnL: 1000 - 750 = +250 cents profit
      operationId: resolveMarket
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/marketID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - outcome
              properties:
                outcome:
                  type: string
                  enum: [YES, NO]
                  example: YES
      responses:
        '200':
          description: Market resolved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Market resolved: YES'
                  outcome:
                    type: string
                    example: YES
                  status:
                    type: string
                    example: RESOLVED
        '400':
          description: Invalid state or outcome
        '403':
          description: Requires admin role

  /markets/{marketID}/comments:
    get:
      tags:
        - Markets
      summary: List top-level comments for a market
      description: Retrieve top-level (parent_id = null) comments for a market. Supports pagination.
      operationId: listMarketComments
      parameters:
        - $ref: '#/components/parameters/marketID'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Maximum number of results
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Pagination offset
      responses:
        '200':
          description: Comments retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  total:
                    type: integer
                    example: 42
                  limit:
                    type: integer
                    example: 20
                  offset:
                    type: integer
                    example: 0
        '404':
          description: Market not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Markets
      summary: Create a top-level comment on a market
      description: Create a new comment on a market. Authentication required.
      operationId: createMarketComment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/marketID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required

  /comments/{commentID}/replies:
    get:
      tags:
        - Markets
      summary: List replies to a comment
      description: Retrieve direct replies (one level) to a comment. Supports pagination.
      operationId: listCommentReplies
      parameters:
        - $ref: '#/components/parameters/commentID'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Replies retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  replies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '404':
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Markets
      summary: Create a reply to a comment
      description: Create a reply to an existing comment. Authentication required.
      operationId: createCommentReply
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/commentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Reply created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Validation error or maximum nesting exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required

  /comments/{commentID}:
    patch:
      tags:
        - Markets
      summary: Update a comment
      description: Update an existing comment (owner only). Authentication required.
      operationId: updateComment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/commentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '200':
          description: Comment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Validation error
        '401':
          description: Authentication required
        '403':
          description: Not authorized to edit this comment

    delete:
      tags:
        - Markets
      summary: Delete (soft) a comment
      description: Soft-delete a comment (owner only). Authentication required.
      operationId: deleteComment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/commentID'
      responses:
        '200':
          description: Comment deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Comment deleted successfully
        '401':
          description: Authentication required
        '403':
          description: Not authorized to delete this comment

  /comments/{commentID}/vote:
    post:
      tags:
        - Markets
      summary: Vote on a comment
      description: Upvote or downvote a comment. Clicking the same vote again removes the vote. Authentication required.
      operationId: voteComment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/commentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '200':
          description: Vote applied successfully (returns updated comment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Invalid vote type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
        '404':
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /admin/users:
    get:
      tags:
        - Admin
      summary: List users
      description: Retrieve a paginated list of all registered users (admin only). Password hashes are omitted.
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          description: Authentication required
        '403':
          description: Requires admin role

  /admin/users/{userID}:
    get:
      tags:
        - Admin
      summary: Get user details
      description: Retrieve detailed information about a specific user (admin only).
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userID'
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

  /admin/users/{userID}/deactivate:
    post:
      tags:
        - Admin
      summary: Deactivate user
      description: Deactivates a user account. Deactivated users cannot log in.
      operationId: deactivateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userID'
      responses:
        '200':
          description: User deactivated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User deactivated successfully

# ==============================================================================
# COMPONENTS
# ==============================================================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from `/auth/login` or `/auth/register`.
        
        **Header format:**
        ```
        Authorization: Bearer <token>
        ```

  parameters:
    marketID:
      name: marketID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Market UUID
      example: f6ca8e7b-38bc-4c4d-ab42-0ec1ca8e877d
      commentID:
      name: commentID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Comment UUID
      example: c3f9f2d7-8f3a-4b2d-9c1a-1234567890ab
    userID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: User UUID
      example: 02104dfb-cc72-44f8-8c8d-d57ae4450493

  schemas:
    # ==========================================================================
    # AUTH SCHEMAS
    # ==========================================================================
    
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token (expires in 15 minutes)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          description: Refresh token for obtaining new access tokens
          example: bacc17995ce580d73616478a2661fe3772ca3eef...
        expires_in:
          type: integer
          description: Access token expiration in seconds
          example: 900
        token_type:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 02104dfb-cc72-44f8-8c8d-d57ae4450493
        email:
          type: string
          format: email
          example: trader@example.com
        username:
          type: string
          example: cryptotrader
        full_name:
          type: string
          example: John Doe
        role:
          type: string
          enum: [USER, ADMIN]
          example: USER
        created_at:
          type: string
          format: date-time
          example: 2026-03-07T18:00:56Z

    # ==========================================================================
    # MARKET SCHEMAS
    # ==========================================================================
    
    Market:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: f6ca8e7b-38bc-4c4d-ab42-0ec1ca8e877d
        question:
          type: string
          example: Will Bitcoin reach $100k by end of month?
        description:
          type: string
          example: Resolves YES if BTC >= $100,000 on any exchange
        status:
          type: string
          enum: [PENDING, OPEN, CLOSED, RESOLVED]
          example: OPEN
        liquidity_param:
          type: integer
          format: int64
          description: Liquidity parameter in cents
          example: 500000
        yes_price:
          type: number
          format: double
          nullable: true
          description: Current YES price (0-100, only for OPEN markets)
          example: 62.5
        no_price:
          type: number
          format: double
          nullable: true
          description: Current NO price (0-100, only for OPEN markets)
          example: 37.5
        created_by:
          type: string
          format: uuid
          description: Admin user who created the market
          example: 67d6c5da-177b-48f3-8e8b-82332f99e832
        created_at:
          type: string
          format: date-time
          example: 2026-03-07T18:01:01Z
        closes_at:
          type: string
          format: date-time
          description: When trading ends
          example: 2026-04-06T18:01:01Z
        resolved_outcome:
          type: string
          enum: [YES, NO]
          nullable: true
          description: Final outcome (only for RESOLVED markets)
          example: YES
        resolved_by:
          type: string
          format: uuid
          nullable: true
          description: Admin who resolved the market
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: When market was resolved
        updated_at:
          type: string
          format: date-time
          example: 2026-03-07T18:01:01Z

    # ==========================================================================
    # TRADING SCHEMAS
    # ==========================================================================
    
    Trade:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: abc123-def456-789012
        user_id:
          type: string
          format: uuid
          example: 02104dfb-cc72-44f8-8c8d-d57ae4450493
        market_id:
          type: string
          format: uuid
          example: f6ca8e7b-38bc-4c4d-ab42-0ec1ca8e877d
        outcome:
          type: string
          enum: [YES, NO]
          example: YES
        shares:
          type: number
          format: double
          description: Number of shares bought
          example: 10.0
        cost_paid:
          type: integer
          format: int64
          description: Cost in cents
          example: 501
        created_at:
          type: string
          format: date-time
          example: 2026-03-08T15:30:00Z

    Position:
      type: object
      description: User's holdings in a market
      properties:
        user_id:
          type: string
          format: uuid
          example: 02104dfb-cc72-44f8-8c8d-d57ae4450493
        market_id:
          type: string
          format: uuid
          example: f6ca8e7b-38bc-4c4d-ab42-0ec1ca8e877d
        yes_shares:
          type: number
          format: double
          description: Number of YES shares owned
          example: 10.0
        no_shares:
          type: number
          format: double
          description: Number of NO shares owned
          example: 5.0
        cost_basis:
          type: integer
          format: int64
          description: Total amount spent in cents
          example: 750
        realized_pnl:
          type: integer
          format: int64
          nullable: true
          description: Profit/loss after settlement (null until resolved)
          example: 250
        created_at:
          type: string
          format: date-time
          example: 2026-03-08T15:30:00Z
        updated_at:
          type: string
          format: date-time
          example: 2026-03-08T15:35:00Z
    # -----------------------------------------------------------------------
    # Comments
    # -----------------------------------------------------------------------
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: c3f9f2d7-8f3a-4b2d-9c1a-1234567890ab
        market_id:
          type: string
          format: uuid
          example: f6ca8e7b-38bc-4c4d-ab42-0ec1ca8e877d
        user_id:
          type: string
          format: uuid
          example: 02104dfb-cc72-44f8-8c8d-d57ae4450493
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Parent comment ID for replies (null for top-level)
        content:
          type: string
          example: This is a comment.
        is_deleted:
          type: boolean
          example: false
        vote_count:
          type: integer
          example: 5
        current_user_vote:
          type: string
          enum: [UPVOTE, DOWNVOTE, NONE]
          nullable: true
          description: The authenticated user's vote on this comment (if any)
        created_at:
          type: string
          format: date-time
          example: 2026-03-08T15:30:00Z
        updated_at:
          type: string
          format: date-time
          example: 2026-03-08T15:35:00Z

    CreateCommentRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000
          example: This is my comment

    VoteRequest:
      type: object
      required:
        - vote_type
      properties:
        vote_type:
          type: string
          enum: [UPVOTE, DOWNVOTE]
          example: UPVOTE

    # ==========================================================================
    # ERROR SCHEMAS
    # ==========================================================================
    
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
          example: Invalid request body
        details:
          type: object
          nullable: true
          description: Additional error context
          properties:
            error_code:
              type: string
              example: INVALID_JSON
            field:
              type: string
              nullable: true
              example: email
            hint:
              type: string
              nullable: true
              example: Email must be unique
